<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Hamideh AR</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
      }
      /* صفحه شروع برای باز کردن قفل پخش ویدیو در موبایل */
      #start-screen {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #fff;
        text-align: center;
      }
      #start-btn {
        padding: 14px 32px;
        font-size: 18px;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
      }
      /* ویدیوی تمام‌صفحه */
      #fullscreen-video {
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 5000;
        display: none;
        background: #000;
      }
    </style>
  </head>
  <body>

    <!-- صفحه لمس اولیه برای مجوز پخش ویدیو در موبایل -->
    <div id="start-screen">
      <p>دوربین را مقابل پلاک بگیرید</p>
      <button id="start-btn">شروع اسکن ✨</button>
    </div>

    <!-- ویدیوی تمام صفحه (مستقیماً فایل s1.mp4 کنار کد را می‌خواند) -->
    <video id="fullscreen-video" src="./s1.mp4" playsinline webkit-playsinline preload="auto"></video>

    <!-- صحنه واقعیت افزوده با حساسیت بالا برای تشخیص سریع‌تر پلاک -->
    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; warmupTolerance: 1; missTolerance: 5; filterMinCF: 0.0001; filterBeta: 0.001;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- پشتیبانی از حداکثر ۵ عکس مختلف از پلاک در فایل targets.mind -->
      <a-entity mindar-image-target="targetIndex: 0" class="pendant-target"></a-entity>
      <a-entity mindar-image-target="targetIndex: 1" class="pendant-target"></a-entity>
      <a-entity mindar-image-target="targetIndex: 2" class="pendant-target"></a-entity>
      <a-entity mindar-image-target="targetIndex: 3" class="pendant-target"></a-entity>
      <a-entity mindar-image-target="targetIndex: 4" class="pendant-target"></a-entity>
    </a-scene>

    <script>
      const startScreen = document.getElementById('start-screen');
      const startBtn = document.getElementById('start-btn');
      const video = document.getElementById('fullscreen-video');
      const targets = document.querySelectorAll('.pendant-target');
      let isPlaying = false;

      // باز کردن قفل ویدیو با اولین لمس کاربر
      startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        video.play().then(() => {
          video.pause();
          video.currentTime = 0;
        }).catch(() => {});
      });

      // به محض تشخیص هر کدام از زوایای پلاک، ویدیو تمام‌صفحه پخش شود
      targets.forEach(target => {
        target.addEventListener("targetFound", () => {
          if (!isPlaying) {
            isPlaying = true;
            video.style.display = 'block';
            video.currentTime = 0;
            video.play();
          }
        });
      });

      // وقتی ویدیو تمام شد، به حالت دوربین برگردد
      video.addEventListener('ended', () => {
        video.style.display = 'none';
        isPlaying = false;
      });
    </script>
  </body>
</html>
